[build]
command = "npm run build"
publish = "dist/client"
functions = "dist/server"

[functions]
node_bundler = "esbuild"
external_node_modules = ["leaflet"]

[build.cache]
paths = ["node_modules/.cache"]

# Route all requests to the server function
[[redirects]]
from = "/*"
to = "/.netlify/functions/server"
status = 200
